<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />
  <title>Trygdle · Data</title>
  <meta name="description" content="Alle selskapene i Folketrygdfondets aksjeportefølje med nøkkeltall." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%236aaa64'/%3E%3Crect x='9' y='19' width='4' height='8' rx='1' fill='%23fff'/%3E%3Crect x='16' y='14' width='4' height='13' rx='1' fill='%23fff'/%3E%3Crect x='23' y='9' width='4' height='18' rx='1' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="data-page">
  <header class="topbar">
    <div class="topbar-side">
      <a href="./#hjelp" class="icon-btn" aria-label="Slik spiller du">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </a>
    </div>
    <div class="brand">
      <h1 class="title"><a href="./" title="Til spillet">Trygdle</a></h1>
      <nav class="modes" aria-label="Modus">
        <a class="mode-btn" href="./" id="daily-link">I dag</a>
        <span class="mode-sep" aria-hidden="true">·</span>
        <a class="mode-btn" href="./#frispill">Frispill</a>
      </nav>
    </div>
    <div class="topbar-side right">
      <a href="./" class="icon-btn active" aria-label="Tilbake til spillet" title="Tilbake til spillet">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>
      </a>
      <a href="./#kalender" class="icon-btn" aria-label="Velg dag" title="Tidligere dager">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      </a>
      <a href="./#statistikk" class="icon-btn" aria-label="Statistikk">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      </a>
    </div>
  </header>

  <main class="data-main">
    <div class="data-tools">
      <input id="q" class="guess-input data-search" type="search" placeholder="Søk selskap, ticker, sektor eller by" autocomplete="off" spellcheck="false" />
      <div class="data-filters" id="filters"></div>
    </div>
    <p class="data-count" id="count"></p>
    <div class="table-wrap">
      <table class="dt">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p id="source" class="source"></p>
  </main>

  <script src="portfolio_data.js"></script>
  <script src="market_data.js"></script>
  <script src="data.js"></script>
</body>
</html>
