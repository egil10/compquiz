<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />
  <title>Trygdle</title>
  <meta name="description" content="Gjett dagens selskap i Folketrygdfondets portefølje på seks forsøk." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%236aaa64'/%3E%3Crect x='9' y='19' width='4' height='8' rx='1' fill='%23fff'/%3E%3Crect x='16' y='14' width='4' height='13' rx='1' fill='%23fff'/%3E%3Crect x='23' y='9' width='4' height='18' rx='1' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Old (cached) pages linked to ./#kalender, ./#statistikk, ./#hjelp – send those to the real pages.
    (function () {
      var m = { kalender: "kalender.html", statistikk: "statistikk.html", hjelp: "hjelp.html", data: "data.html" };
      var k = (location.hash || location.search).replace(/^[#?]/, "");
      if (m[k]) location.replace(m[k]); /* legacy links */
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=c1579088" />
</head>
<body>
  <header id="topbar" data-page="game"></header>
  <script src="shell.js?v=2417e42e"></script>

  <main class="game">

    <section class="board" aria-label="Gjetninger">
      <div class="board-head">
        <span>Land</span>
        <span>Sektor</span>
        <span title="Børsverdi i norske kroner">Mcap <small>NOK</small></span>
        <span>P/E</span>
        <span title="EV/EBITDA">EV/EBITDA</span>
        <span title="Folketrygdfondets eierandel">Eier</span>
        <span>Stiftet</span>
      </div>
      <div id="board-rows"></div>
    </section>

    <div class="dock">
      <div id="ytd"></div>
      <section class="entry" id="entry">
        <div id="hints" class="hints" aria-live="polite"></div>
        <div id="ac" class="ac hidden" role="listbox"></div>
        <div class="entry-row">
          <input
            type="text"
            id="guess-input"
            class="guess-input"
            placeholder="Selskap eller ticker"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="go"
            aria-label="Gjett selskap"
          />
          <button id="btn-hint" class="hint-btn" type="button">Hint</button>
        </div>
      </section>

      <section id="done-bar" class="done-bar hidden">
        <button id="btn-show-result" class="ghost-btn" type="button">Resultat</button>
        <button id="btn-next" class="primary-btn" type="button">Neste</button>
      </section>

      <p id="source" class="source"></p>
    </div>
  </main>

  <div class="overlay hidden" id="modal-result" role="dialog" aria-modal="true" aria-labelledby="result-name">
    <div class="sheet result-sheet">
      <button class="close-btn" data-close="modal-result" aria-label="Lukk">&times;</button>
      <div id="result-body"></div>
    </div>
  </div>





  <script src="portfolio_data.js?v=4c529262"></script>
  <script src="daily_order.js?v=09606556"></script>
  <script src="market_data.js?v=6c557c20"></script>
  <script src="app.js?v=54add6e8"></script>
</body>
</html>
